[package]
name = "music-creator-studio-yue2"
version = "1.0.0"
description = "Music Creator Studio YuE2 - ComfyUI/YuE2 based local music generation studio"
authors = ["utausnskareshi"]
license = "Apache-2.0"
repository = "https://github.com/utausnskareshi/music-creator-studio-yue2"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mcs_yue2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: a JSON schema's property order reaches llama.cpp as the page wrote it (its grammar makes the
# model write the fields in that order: the draft's title and lyrics before the explanation of them)
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "multipart"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = "0.4"
dirs = "6"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
http = "1"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
